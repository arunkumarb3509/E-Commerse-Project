  <nav class="navbar navbar-expand-lg navbar-light">
    <div class="container">
      <a class="navbar-brand" href="#">
        <img src="../../assets/Images/ff_navbar_logo.svg" alt="logo" class="w-25">
        <h3 class="d-inline fw-bold">FASHION FLAIR</h3>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="input-group">
        <!-- <div class="input-group-prepend">
          <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-haspopup="true"
            aria-expanded="false">All</button>
          <div class="dropdown-menu">
            <div class="row">
              Loop through main categories
              <div class="col-lg-3" *ngFor="let category of main_category">
                <h6 class="categoriesTitle">{{ category.categoryName }}</h6>
              
                Loop through subcategories for each main category
                <a *ngFor="let subCategory of category.subCategories" class="dropdown-item" href="#">
                  {{ subCategory.subCategoryName }}
                </a>
              </div>
              
            </div>
          </div>

        <!-- ALL Dropdown --> 
        <div class="input-group-prepend">
          <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-haspopup="true"
            aria-expanded="false">All</button>
          <div class="dropdown-menu custom-dropdown">
            <div class="row">
              <div class="col-lg-3" *ngFor="let category of main_category">
                <h6 class="categoriesTitle">{{ category.categoryName }}</h6>
                <a *ngFor="let subCategory of category.subCategories" class="dropdown-item" href="#">
                  {{ subCategory.subCategoryName }}
                </a>
              </div>
            </div>
          </div>
        </div>

        <input type="text" class="form-control" placeholder="Search" aria-label="Text input with dropdown button">
        <div class="input-group-append">
          <button class="btn btn-secondary" type="button"><i class="bi bi-search"></i></button>
        </div>
      </div>


      <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasMenu" aria-labelledby="offcanvasMenuLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasMenuLabel">Menu</h5>
          <button type="button" class="btn-close text-reset cancelBtn" data-bs-dismiss="offcanvas"
            aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <!-- Buttons -->
            <li class="nav-item">
              <a class="nav-link fw-bold" href="#" (click)="showCategory('men')">MEN</a>
            </li>
            <li class="nav-item">
              <a class="nav-link fw-bold" href="#" (click)="showCategory('women')">WOMEN</a>
            </li>
            <li class="nav-item">
              <a class="nav-link fw-bold" href="#" (click)="showCategory('kids')">KIDS</a>
            </li>

            <!-- SINGLE STATIC DROPDOWN -->
            <li class="nav-item dropdown" [class.show]="showDropdown">
              <ul class="dropdown-menu custom-dropdown wide-dropdown" [class.show]="showDropdown">
                <div class="dropdown-container" *ngIf="selectedCategoryData.length > 0">
                  <div *ngFor="let category of selectedCategoryData" class="category-block">
                    <h6 class="categoriesTitle">{{ category.categoryName }}</h6>
                    <div class="row">
                      <div class="col-md-4" *ngFor="let subCategory of category.subCategories">
                        <a class="dropdown-item" href="#">{{ subCategory.subCategoryName }}</a>
                      </div>
                    </div>
                  </div>
                </div>
              </ul>
            </li>
          </ul>
        </div>



      </div>


    </div>
  </nav>
</div>
