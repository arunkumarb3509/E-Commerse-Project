          <div class="dropdown-menu custom-dropdown">

                <h6 class="categoriesTitle">{{ category.categoryName }}</h6>
                <a *ngFor="let subCategory of category.subCategories" class="dropdown-item" href="#">

                </a>
              </div>
            </div>
          </div>
        </div>

        </div>

      <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasMenu" aria-labelledby="offcanvasMenuLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasMenuLabel">Menu</h5>
          <button type="button" class="btn-close text-reset cancelBtn" data-bs-dismiss="offcanvas"
            aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <!-- Buttons -->
            <li class="nav-item">
              <a class="nav-link fw-bold" href="#" (click)="showCategory('men')">MEN</a>
            </li>
            <li class="nav-item">
              <a class="nav-link fw-bold" href="#" (click)="showCategory('women')">WOMEN</a>
            </li>
            <li class="nav-item">
              <a class="nav-link fw-bold" href="#" (click)="showCategory('kids')">KIDS</a>
            </li>

            <!-- SINGLE STATIC DROPDOWN -->
            <li class="nav-item dropdown" [class.show]="showDropdown">
              <ul class="dropdown-menu custom-dropdown wide-dropdown" [class.show]="showDropdown">
                <div class="dropdown-container" *ngIf="selectedCategoryData.length > 0">
                  <div *ngFor="let category of selectedCategoryData" class="category-block">
                    <h6 class="categoriesTitle">{{ category.categoryName }}</h6>
                    <div class="row">
                      <div class="col-md-4" *ngFor="let subCategory of category.subCategories">
                        <a class="dropdown-item" href="#">{{ subCategory.subCategoryName }}</a>
                      </div>
                    </div>
                  </div>
                </div>
              </ul>
            </li>
          </ul>
