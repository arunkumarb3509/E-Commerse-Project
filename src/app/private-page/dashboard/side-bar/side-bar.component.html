<div class="wrapper">
  <!-- Sidebar -->

  <input type="checkbox" id="sidebar-toggle" hidden>
  <div *ngIf="userType === 'seller'">
  <nav id="sidebar" [ngClass]="{ active: isSidebarActive }">

 
    <ul class="list-unstyled components">
      <!-- <div *ngIf="userType === 'seller'"> -->
      <li>
        <a class="text-center dashboard-text" (click)="onSidebarItemClick()">Dashboard</a>
      </li>
      <li>
        <a
          href="#generalSetup"
          data-toggle="collapse"
          data-bs-toggle="collapse"
          data-bs-target="#generalSetup"
          aria-controls="generalSetup"
          aria-expanded="false"
          aria-label="Toggle navigation"
          class="dropdown-toggle"
          (click)="onSidebarItemClick()"
        >
          <i class="fa fa-tachometer me-3"></i>Home
        </a>
        <ul class="collapse list-unstyled" id="generalSetup">
          <li>
            <a
              routerLinkActive="active"
              routerLink="/fashionflair/dashboard"
              (click)="onSidebarItemClick()"
              >About</a
            >
          </li>
          <li>
            <a
              routerLinkActive="active"
              routerLink="/fashionflair/dashboard"
              (click)="onSidebarItemClick()"
              >Designation</a
            >
          </li>
        </ul>
      </li>
      <!-- Add click events for all sidebar links -->
      <li>
        <ul class="collapse list-unstyled" id="Jobs">
       
        </ul>
      </li>
    <!-- </div> -->
      <!-- <div *ngIf="userType === 'customer'"> -->
      <li>
        <a
          href="#CompanyProfile"
          data-toggle="collapse"
          data-bs-toggle="collapse"
          data-bs-target="#CompanyProfile"
          aria-controls="projects"
          aria-expanded="false"
          aria-label="Toggle navigation"
          class="dropdown-toggle"
          (click)="onSidebarItemClick()"
        >
          <i class="fa fa-user me-3"></i>Profile
        </a>
        <ul class="collapse list-unstyled" id="CompanyProfile">
          <li>
            <a
              routerLinkActive="active"
              routerLink="/fashionflair/dashboard/my-profile"
              (click)="onSidebarItemClick()"
              >My Profile</a
            >
          </li>
          <li>
            <a
              routerLinkActive="active"
              routerLink="/fashionflair/dashboard/business-profile"
              (click)="onSidebarItemClick()"
              >Business Profile</a
            >
          </li>
        </ul>
      </li>
     
      <li>
        <a
          href="#CompanyProfile"
          data-toggle="collapse"
          data-bs-toggle="collapse"
          data-bs-target="#categories"
          aria-controls="projects"
          aria-expanded="false"
          aria-label="Toggle navigation"
          class="dropdown-toggle"
          (click)="onSidebarItemClick()"
        >
         <i class="fa fa-tags me-2"></i>Categories
        </a>
        <ul class="collapse list-unstyled" id="categories">
          <li>
            <a
              routerLinkActive="active"
              routerLink="/fashionflair/dashboard/main-categories"
              (click)="onSidebarItemClick()"
              >Main Categories</a
            >
          </li>
          <li>
            <a
              routerLinkActive="active"
              routerLink="/fashionflair/dashboard/sub-categories"
              (click)="onSidebarItemClick()"
              >Sub Categories</a
            >
          </li>
        </ul>
      </li>
    <!-- </div> -->
  
      <li>
        <a
          href="#Products"
          data-toggle="collapse"
          data-bs-toggle="collapse"
          data-bs-target="#Products"
          aria-controls="projects"
          aria-expanded="false"
          aria-label="Toggle navigation"
          class="dropdown-toggle"
          (click)="onSidebarItemClick()"
        >
          <i class="fa fa-cube  me-2"></i>Products
        </a>
        <ul class="collapse list-unstyled" id="Products">
          <li>
            
            <a
            routerLinkActive="active"
            routerLink="/fashionflair/dashboard/products/view-products"
            (click)="onSidebarItemClick()"
            >View Product</a
          >
          </li>

          <li>
            <a
              routerLinkActive="active"
              routerLink="/fashionflair/dashboard/products/create-products"
              (click)="onSidebarItemClick()"
              > Create Product</a
            >
           
          </li>
        </ul>
      </li>
    </ul>
  </nav>
  </div>
</div>
