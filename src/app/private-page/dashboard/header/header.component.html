<!-- private -top-banner -->
<header class="sticky-top header-section">
  <div class="container-fluid text-center">
    <div *ngIf="loggedInUserType == 'seller'; else customerLogin">
      <!-- <div class="row" *ngFor="let userDetails of loggedInUserDetails">
          <div class="col-lg-1">
          <button (click)="toggleSidebar()" class="togglebutton">
            <i class="fa fa-bars" aria-hidden="true"></i>
          </button>
          </div>
          <div class="col-lg-10">
             <h4>Welcome {{userDetails.firstName}}</h4>
          </div>
    
          <div class="col-lg-1">
              <button class="logout-button" (click)="clearUser()">
                <i class="fa fa-sign-out"></i>
              </button>
          </div>
        </div> -->
      <div
        class="row align-items-center"
        *ngFor="let userDetails of loggedInUserDetails"
      >
        <div class="col-md-6 d-flex align-items-center gap-5">
          <button (click)="toggleSidebar()" class="togglebutton">
            <i class="fa fa-bars" aria-hidden="true"></i>
          </button>

          <i
            class="fa fullscreen-toggle-icon"
            [ngClass]="isFullscreen ? 'fa-compress' : 'fa-expand'"
            (click)="toggleFullscreen()"
          >
          </i>

          <h1 class="welcome-text mb-0">Welcome {{ userDetails.firstName }}</h1>
        </div>

        <div class="col-md-6 text-end">
          <button class="logout-button" (click)="clearUser()">
            <i class="fa fa-sign-out"></i>
          </button>
          <div class="header-actions">
            <div class="search-box me-3">
              <i class="bi bi-search"></i>
              <input
                type="text"
                class="form-control"
                placeholder="Search products, orders..."
              />
            </div>
            <button class="btn btn-link notification-btn me-3">
              <i class="bi bi-bell"></i>
              <span class="notification-badge"></span>
            </button>
            <div class="user-profile">
              <div class="user-avatar">
                <i class="bi bi-person-circle"></i>
              </div>
              <span class="user-name">{{ userDetails.firstName }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- customer header -->
    <ng-template #customerLogin>
      <div class="row" *ngFor="let userDetails of loggedInUserDetails">
        <div class="col-lg-1">
          <i
            class="fa fullscreen-toggle-icon"
            [ngClass]="isFullscreen ? 'fa-compress' : 'fa-expand'"
            (click)="toggleFullscreen()"
          >
          </i>
          <!-- <button (click)="toggleSidebar()" class="togglebutton">
            <i class="fa fa-bars" aria-hidden="true"></i>
          </button> -->
        </div>
        <div class="col-lg-10">
          <h1 class="welcome-text mb-0">Welcome {{ userDetails.firstName }}</h1>
        </div>

        <div class="col-lg-1">
          <button class="logout-button" (click)="clearUser()">
            <i class="fa fa-sign-out"></i>
          </button>
        </div>
      </div>
    </ng-template>
  </div>
</header>
