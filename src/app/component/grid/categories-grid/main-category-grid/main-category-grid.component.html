
<div class="container-fluid">
<table class="table table-hover table-bordered mt-3 ms-1">
  <thead class="table-color">
    <tr>
      <th scope="col" colspan="7" class="text-center">Main Category List</th>
    </tr>
    <tr>
      <th scope="col">Main Category</th>
      <th scope="col">Description</th>
      <th scope="col" class="hidden-cols">Created Date</th>
      <th scope="col" class="hidden-cols">Updated Date</th>
      <th scope="col">Action</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let category of mainCategories">
      <td>{{ category.categoryName }}</td>
      <td>{{ category.description }}</td>
      <td class="hidden-cols">{{ category.createdAt | date: 'medium' }}</td>
      <!-- <td>{{ category.createdAt | date: 'dd/mm/yyyy' }}</td> -->
      <td class="hidden-cols">{{ category.updatedAt | date: 'medium' }}</td>
      <td class="fs-5 text-center">
        <i
          class="fa fa-pencil-square-o edit-btn"
          aria-hidden="true"
          (click)="navigateToEditCategory(category.categoryId)"
        ></i>/
        <i
          class="fa fa-trash delete-btn"
          aria-hidden="true"
          (click)="openConfirmDialog(category.categoryId)"
        ></i>
      </td>
    </tr>
  </tbody>
  <div *ngIf="noMainCategory" class="text-center text-danger">
    No main categories found
  </div>
</table>
</div>

<!-- Confirmation Dialog -->
<div class="confirm-dialog" *ngIf="showConfirmDialog">
  <div class="dialog-content">
    <p>Are you sure you want to delete this record?</p>
    <button class="confirm-btn" (click)="confirmDelete()">Confirm</button>
    <button class="cancel-btn" (click)="cancelDelete()">Cancel</button>
  </div>
</div>
