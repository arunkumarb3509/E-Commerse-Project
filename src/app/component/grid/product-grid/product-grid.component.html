<!-- product grid -->

<div class="banner">
  <b>View Products</b>
</div>

<div class="container-fluid">
  <div class="col-12 mb-2">
    <div class="d-flex justify-content-end">
      <button 
        class="btn" 
        type="button" 
        routerLink="/fashionflair/dashboard/products/create-products">
        Create Product
      </button>
    </div>
  </div>
  

  <table class="table table-hover table-bordered">
    <thead>
      <tr>
        <th scope="col">Product Code</th>
        <th scope="col">Product Name</th>
        <th scope="col" class="hidden-cols">Brand</th>
        <th scope="col">Price</th>
        <th scope="col" class="hidden-cols">Total Stock</th>
        <th scope="col" class="hidden-cols">Availability</th>
        <th scope="col">Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let product of getAllProductDetails">
        <td >{{ product.productCode }}</td>
        <td>{{ product.productName }}</td>
        <td class="hidden-cols">{{ product.brand }}</td>
        <td>{{ product.price | currency }}</td>
        <td class="hidden-cols">{{ product.totalStock }}</td>
        <td class="hidden-cols">{{ product.availability }}</td>
        <td class="fs-5 text-center">
          <i
            class="fa fa-pencil-square-o btn-primary"
            aria-hidden="true"
            (click)="navigateToEditProducts(product.productId)"
          ></i>

          <i
            class="fa fa-chevron-circle-right edit-btn"
            aria-hidden="true"
            (click)="navigateToViewProductDetails(product.productId)"
          ></i>
        </td>
      </tr>
      <tr *ngIf="noProductData == true">
        <td colspan="7" class="text-center">No products found.</td>
      </tr>
    </tbody>
  </table>
</div>
