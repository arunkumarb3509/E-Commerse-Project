<div class="container-fluid">
  <div class="row">
    <div class="col-lg-5 ps-0 pe-0">
      <div id="signUpCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img class="d-block w-100 carouselImg" src="../../../assets/Images/signup-caurosel1.jpg" alt="First slide">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100 carouselImg" src="../../../assets/Images/signup-carousel 2.jpg"
              alt="Second slide">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100 carouselImg" src="../../../assets/Images/signup-carousel 3.jpg" alt="Third slide">
          </div>
        </div>
        <a class="carousel-control-prev" href="#signUpCarousel" role="button" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </a>
        <a class="carousel-control-next" href="#signUpCarousel" role="button" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </a>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="row">
        <div class="form-container">
          <h4 class="card-header fw-bold text-center">Thank You</h4>
          <div class="card-body">
            <img src="../../../../assets/Images/submitted_success.png" alt="successTickImg" class="successTickImg">
            <h4 class="successText">Your submission has been sent.</h4>
            <a class="signInText" routerLink="/customer-signIn">SignIn</a>
          </div>
        </div>
      </div>
    </div>
  </div>
