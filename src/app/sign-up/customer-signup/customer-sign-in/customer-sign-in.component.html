  <div class="signin-right">
  <div class="signin-card shadow">
    <h2 *ngIf="!isOTPSent" class="text-center mb-3">Welcome Back!</h2>
    <p *ngIf="!isOTPSent" class="text-center subtext">Sign in to access your account</p>

   
    <div *ngIf="!isOTPSent" class="google-login mb-3">
      <div id="googleBtn"></div>
    </div>

    <hr *ngIf="!isOTPSent">

   
    <form [formGroup]="loginForm" (ngSubmit)="signIn()" *ngIf="!isOTPSent">
      
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email" placeholder="Email" formControlName="email">
        <label for="email">Email</label>
      </div>


      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="password" placeholder="Password" formControlName="password">
        <label for="password">Password</label>
      </div>

      <div class="d-grid gap-2 mb-3">
        <button class="btn signin-btn" type="submit" [disabled]="loginForm.invalid">Sign In</button>
        <button class="btn cancel-btn" type="button" routerLink="/sign-up">Create Account</button>
      </div>

      <p class="text-center">
        <a routerLink="/forgot-password" class="forgot-link">Forgot password?</a>
      </p>
    </form>

    <div *ngIf="isOTPSent" class="otp-container">
  <h4 class="text-center mb-3">OTP Verification</h4>

  <form [formGroup]="signInOtpForm" (ngSubmit)="verifyOTP()">
    <div class="otp-inputs" formArrayName="otp">
      <ng-container *ngFor="let control of otpArray.controls; let i = index">
        <input
          type="text"
          maxlength="1"
          [formControlName]="i"
          (input)="onInput($event, i)"
          (keydown)="onKeyDown($event, i)"
          class="otp-box"
        />
      </ng-container>
    </div>

    <div class="d-grid gap-2 mt-3">
      <button
        class="btn otp-btn"
        type="submit"
        [disabled]="afterOtpVerified"
      >
        Verify OTP
      </button>
    </div>
  </form>

  <!-- ⏱ Timer display -->
  <p class="text-center mt-2 timer-text">
    Time left: <strong>{{ formattedTime }}</strong>
  </p>

  <!-- 🔁 Resend button -->
  <p class="text-center mt-2">
    <button
      class="link-button"
      (click)="resendOTP()"
      [disabled]="isTimerRunning || afterOtpVerified"
    >
      Resend OTP?
    </button>
  </p>
</div>
