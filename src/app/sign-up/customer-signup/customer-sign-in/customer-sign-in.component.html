<div class="container-fluid">
  <div class="row">
    <div class="col-lg-5 ps-0 pe-0">
      <div id="signUpCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner ">
          <div class="carousel-item active">
            <img class="d-block w-100 carouselImg" src="../../../assets/Images/signup-caurosel1.jpg" alt="First slide">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100 carouselImg" src="../../../assets/Images/signup-carousel 2.jpg"
              alt="Second slide">
          </div>
          <div class="carousel-item">
            <img class="d-block w-100 carouselImg" src="../../../assets/Images/signup-carousel 3.jpg" alt="Third slide">
          </div>
        </div>
        <a class="carousel-control-prev" href="#signUpCarousel" role="button" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </a>
        <a class="carousel-control-next" href="#signUpCarousel" role="button" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </a>
      </div>
    </div>
    <div class="col-lg-7">
      <div class="row">
        <form [formGroup]="loginForm" (ngSubmit)="signIn()" *ngIf="!isOTPSent">
          <div class="form-container">
            <h4 class="card-header fw-bold text-center">Sign In</h4>
            <div class="card-body">
              <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="name@example.com"
                  formControlName="email">
                <label for="email">Email address</label>
                <div *ngIf="loginForm.controls['email'].invalid && 
                    (loginForm.controls['email'].dirty || 
                    loginForm.controls['email'].touched)" class="text-danger">
                  Please enter a valid email address.
                </div>
                <div *ngIf="inCorrectMail" class="text-danger">
                  {{errorMessage}}
                </div>
                <div *ngIf="mailInCorrect" class="text-danger">
                  Invalid Mail
                </div>
              </div>
              <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password" placeholder="Password"
                  formControlName="password">
                <label for="password">Password</label>
                <div *ngIf="loginForm.controls['password'].invalid && 
                    (loginForm.controls['password'].dirty || 
                    loginForm.controls['password'].touched)" class="text-danger">
                  Password is required.
                </div>
                <div *ngIf="inCorrectMessage" class="text-danger">
                  {{errorMessage}}
                </div>
                <div *ngIf="inCorrectMail" class="text-danger">
                  invalid password
                </div>
              </div>
            </div>
            <div class="d-grid gap-2 d-md-flex justify-content-md-end mb-2 me-2 ms-2">
              <button class="btn" type="submit" [disabled]="loginForm.invalid">Sign In</button>
              <button class="btn" type="button" routerLink="/sign-up">Cancel</button>
            </div>
            <hr>
            <p class="text-center signInText">
              <a class="checkBoxLine" routerLink="/forgot-password">Forgot password?</a>
            </p>
          </div>
        </form>
      </div>
      <div class="form-container" *ngIf="isOTPSent">
        <h4 class="card-header fw-bold text-center">OTP Verification</h4>
        <form [formGroup]="signInOtpForm" (ngSubmit)="verifyOTP()">
          <div class="card-body">
            <div class="text-success otpVerifiedMsg" *ngIf="isOTPVerified">OTP verified successfully</div>
            <div class="text-success otpSuccessMsg" *ngIf="isOTPReSendMessage">{{resendMsg}}</div>
            <div class="text-danger otpIncorrectMsg" *ngIf="!isOTPVerified && errorMessage">{{ errorMessage }}</div>
            <div class="otp-card-inputs" formArrayName="otp">
              <ng-container *ngFor="let control of otpArray.controls; let i = index">
                <input type="text" maxlength="1" [formControlName]="i" (keyup)="onKeyUp($event, i)"
                  (input)="onInput($event, i)" #otpInput>
              </ng-container>
            </div>
            <div class="text-center verifyBtn">
              <button class="verifyButton" type="submit" [disabled]="afterOtpVerified">Verify OTP</button>
            </div>
          </div>
        </form>
        <p class="text-center signInText">
          <button class="link-button" (click)="resendOTP()" [disabled]="afterOtpVerified">Resend OTP?</button>
        </p>

        <h6 class="text-success sigInSuccessMsg" *ngIf="afterOtpVerified && isOTPReSendMessage">SignIn successfully</h6>

      </div>
    </div>
  </div>
</div>
