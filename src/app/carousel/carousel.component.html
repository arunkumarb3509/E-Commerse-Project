   <div id="heroCarousel" class="carousel slide position-relative" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div *ngFor="let slide of slides; let i = index" class="carousel-item" [class.active]="i === currentSlide">
      <img [src]="slide.image" class="d-block w-100" style="height: 600px; object-fit: cover" />
      <div class="carousel-caption d-none d-md-block">
        <h1 class="display-4 fw-bold">{{ slide.title }}</h1>
        <p class="lead">{{ slide.subtitle }}</p>
        <button class="btn btn-warning btn-lg">{{ slide.buttonText }}</button>
      </div>
    </div>
  </div>

  <button class="carousel-control-prev" type="button" (click)="prevSlide()">
    <span class="carousel-control-prev-icon"></span>
  </button>
  <button class="carousel-control-next" type="button" (click)="nextSlide()">
    <span class="carousel-control-next-icon"></span>
  </button>

  <div class="carousel-indicators">
    <button
      *ngFor="let slide of slides; let i = index"
      type="button"
      [class.active]="i === currentSlide"
      [attr.aria-current]="i === currentSlide ? 'true' : null"
      (click)="goToSlide(i)"
      [attr.aria-label]="'Slide ' + (i + 1)"
    ></button>
  </div>
</div>
